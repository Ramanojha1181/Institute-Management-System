<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard - Online Classes</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
/* ================= GLOBAL STYLES ================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #f4f7ff;
    overflow-x: hidden;
    color: #333;
}

/* ================= DASHBOARD LAYOUT ================= */
.dashboard {
    display: flex;
    min-height: 100vh;
}

/* ================= SIDEBAR ================= */
.sidebar {
    width: 270px;
    background: linear-gradient(180deg, #0057ff, #1ea1ff);
    padding: 25px 20px;
    color: #fff;
    position: fixed;
    height: 100%;
    overflow-y: auto;
    z-index: 10;
}

.logo {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 35px;
}

.logo-box {
    width: 55px;
    height: 55px;
    border-radius: 18px;
    background: rgba(255, 255, 255, .2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
}

.logo h2 { font-size: 26px; }
.logo p { font-size: 12px; opacity: .8; }

.menu {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.menu a {
    text-decoration: none;
    color: #fff;
    padding: 15px 18px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: .3s;
    font-size: 15px;
}

.menu a:hover, .menu .active {
    background: rgba(255, 255, 255, .2);
}

/* ================= MAIN CONTENT ================= */
.main {
    margin-left: 270px;
    width: calc(100% - 270px);
    padding: 25px;
}

/* ================= TOPBAR ================= */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.search-box {
    flex: 1;
    max-width: 500px;
    background: #fff;
    height: 58px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
}

.search-box input {
    border: none;
    outline: none;
    width: 100%;
    font-size: 15px;
}

.top-icons {
    display: flex;
    align-items: center;
    gap: 15px;
}

.icon-box {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    position: relative;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
    transition: .4s;
}

.badge {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: red;
    color: #fff;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.profile {
    background: #fff;
    padding: 10px 16px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
    transition: .4s;
}

.profile img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
}

.profile h4 { font-size: 15px; }
.profile p { font-size: 12px; color: #666; }

/* ================= POWERFUL ONLINE CLASSES UI ================= */
.classes-section {
    background: #fff;
    border-radius: 24px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);
    margin-top: 20px;
}

.classes-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    margin-bottom: 25px;
    border-bottom: 2px solid #f0f4ff;
    padding-bottom: 20px;
}

.classes-title h3 {
    font-size: 22px;
    font-weight: 600;
    color: #111;
}

.classes-title p {
    font-size: 13px;
    color: #666;
    margin-top: 3px;
}

/* Filter Sub-menu */
.filter-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.filter-btn {
    border: none;
    outline: none;
    background: #f0f4ff;
    color: #4a77ff;
    padding: 8px 18px;
    border-radius: 12px;
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    transition: 0.3s ease;
}

.filter-btn.active, .filter-btn:hover {
    background: #0a5bff;
    color: #fff;
    box-shadow: 0 4px 12px rgba(10, 91, 255, 0.2);
}

/* Classes Dynamic Grid */
.classes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
}

/* Class Modern Card */
.class-ui-card {
    background: #fff;
    border: 1px solid #edf2ff;
    border-radius: 20px;
    padding: 20px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 3px 10px rgba(0,0,0,.02);
    transition: .4s ease;
}

.class-ui-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 15px 30px rgba(0,0,0,.08);
    border-color: #cbdcff;
}

.card-top-info {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 15px;
}

/* Subject Badges styling */
.subject-tag {
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
}
.sub-physics { background: #e9f1ff; color: #0a5bff; }
.sub-chemistry { background: #fff4df; color: #ff9800; }
.sub-maths { background: #e8fff0; color: #17b05c; }
.sub-english { background: #f3e5f5; color: #9c27b0; }

/* Status Badges */
.status-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
}

.status-live {
    background: #e8fff0;
    color: #17b05c;
}
.status-live i {
    font-size: 8px;
    animation: blink 1.2s infinite;
}

.status-upcoming {
    background: #fff4df;
    color: #ff9800;
}

@keyframes blink {
    0% { opacity: 0; }
    50% { opacity: 1; }
    100% { opacity: 0; }
}

/* Middle Schedule Meta */
.class-detail-body h4 {
    font-size: 17px;
    font-weight: 600;
    color: #222;
    margin-bottom: 12px;
}

.schedule-meta-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 18px;
}

.meta-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #666;
}

.meta-row i {
    width: 16px;
    color: #0a5bff;
}

/* Faculty Info Box */
.faculty-row {
    display: flex;
    align-items: center;
    gap: 10px;
    border-top: 1px dashed #e4ecff;
    padding-top: 12px;
    margin-bottom: 15px;
}

.faculty-row img {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
}

.faculty-row h5 {
    font-size: 13px;
    font-weight: 600;
    color: #333;
}

.faculty-row p {
    font-size: 11px;
    color: #888;
}

/* Dynamic Action Buttons */
.card-action-area {
    margin-top: auto;
}

.ui-join-btn {
    width: 100%;
    border: none;
    outline: none;
    background: #0a5bff;
    color: #fff;
    padding: 12px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: 0.3s;
}

.ui-join-btn:hover {
    background: #0046cd;
    box-shadow: 0 5px 15px rgba(10, 91, 255, 0.3);
}

.ui-join-btn:disabled {
    background: #e0e6f5;
    color: #a0aabf;
    cursor: not-allowed;
    box-shadow: none;
}

/* Countdown Area inside Card */
.countdown-text {
    font-size: 11px;
    font-weight: 500;
    color: #ff9800;
    background: #fffdf8;
    border: 1px solid #ffeacc;
    padding: 6px;
    border-radius: 8px;
    text-align: center;
    margin-bottom: 10px;
}

/* HOVER EFFECTS FOR CORE ITEMS */
.icon-box:hover, .profile:hover {
    transform: translateY(-6px);
    box-shadow: 0 15px 30px rgba(0,0,0,.08);
}

/* ================= COMPREHENSIVE RESPONSIVENESS ================= */
@media(max-width:900px) {
    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .dashboard {
        flex-direction: column;
    }

    .main {
        margin-left: 0;
        width: 100%;
        padding: 15px;
    }

    .classes-header {
        flex-direction: column;
        align-items: flex-start;
    }
    
    .filter-controls {
        width: 100%;
    }
    
    .filter-btn {
        flex: 1;
        text-align: center;
        font-size: 13px;
        padding: 8px 10px;
    }
}

@media(max-width: 480px) {
    .classes-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-box">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div>
                <h2>EduSmart</h2>
                <p>School Management</p>
            </div>
        </div>

        <div class="menu">
            <a href="Student_DashBoard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="Attendence.html"><i class="fa-solid fa-calendar-check"></i> Attendance</a>
            <a href="Homework.html"><i class="fa-solid fa-book"></i> Homework</a>
            <a href="Exams.html"><i class="fa-solid fa-file-lines"></i> Exams</a>
            <a href="Fees.html"><i class="fa-solid fa-money-bill"></i> Fees</a>
            <a href="Timetable.html"><i class="fa-solid fa-calendar"></i> Timetable</a>
            <a href="Online_Classes.html" class="active"><i class="fa-solid fa-video"></i> Online Classes</a>
            <a href="Library.html"><i class="fa-solid fa-book-open"></i> Library</a>
            <a href="Downloads.html"><i class="fa-solid fa-download"></i> Downloads</a>
            <a href="Settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
        </div>
    </aside>

    <main class="main">

        <div class="topbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="classSearchInput" placeholder="Search classes by subject or teacher..." onkeyup="searchClasses()">
            </div>

            <div class="top-icons">
                <div class="icon-box">
                    <i class="fa-regular fa-bell"></i>
                    <div class="badge">5</div>
                </div>
                <div class="profile">
                    <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Profile images">
                    <div>
                        <h4>Alex Johnson</h4>
                        <p>Grade 10 - A</p>
                    </div>
                </div>
            </div>
        </div>

        <section class="classes-section">
            <div class="classes-header">
                <div class="classes-title">
                    <h3>Live & Upcoming Online Classes</h3>
                    <p>Track your schedule, browse subjects, and join secure virtual classrooms instantly.</p>
                </div>
                <div class="filter-controls">
                    <button class="filter-btn active" onclick="filterClasses('all', this)">All Classes</button>
                    <button class="filter-btn" onclick="filterClasses('live', this)">Live Now</button>
                    <button class="filter-btn" onclick="filterClasses('today', this)">Today</button>
                    <button class="filter-btn" onclick="filterClasses('upcoming', this)">Upcoming</button>
                </div>
            </div>

            <div class="classes-grid" id="classesGridContainer">
                </div>
        </section>

    </main>
</div>

<script>
    // Live Data Model Container for Online Classes
    const onlineClassesData = [
        {
            id: 1,
            subject: "Physics",
            subjectClass: "sub-physics",
            topic: "Electromagnetic Induction & Waves",
            day: "Today",
            date: "24 May 2026",
            time: "02:00 PM - 03:00 PM",
            status: "live", // live, upcoming
            teacher: "Mr. Robert Smith",
            avatar: "https://randomuser.me/api/portraits/men/11.jpg",
            link: "https://meet.google.com/abc-defg-hij",
            targetTime: "" // empty for live
        },
        {
            id: 2,
            subject: "Chemistry",
            subjectClass: "sub-chemistry",
            topic: "Organic Chemistry: Carbon Structures",
            day: "Today",
            date: "24 May 2026",
            time: "04:30 PM - 05:30 PM",
            status: "upcoming",
            teacher: "Dr. Clara Brown",
            avatar: "https://randomuser.me/api/portraits/women/22.jpg",
            link: "https://meet.google.com/xyz-mno-pqr",
            targetTime: new Date(new Date().getTime() + 2 * 60 * 60 * 1000).toString() // 2 hours from now
        },
        {
            id: 3,
            subject: "Mathematics",
            subjectClass: "sub-maths",
            topic: "Calculus: Limits & Derivatives",
            day: "Tomorrow",
            date: "25 May 2026",
            time: "09:00 AM - 10:15 AM",
            status: "upcoming",
            teacher: "Prof. Alan Turing",
            avatar: "https://randomuser.me/api/portraits/men/33.jpg",
            link: "https://meet.google.com/math-class-link",
            targetTime: new Date(new Date().getTime() + 18 * 60 * 60 * 1000).toString() // 18 hours from now
        },
        {
            id: 4,
            subject: "English",
            subjectClass: "sub-english",
            topic: "Shakespearean Drama & Poetics",
            day: "Tuesday",
            date: "26 May 2026",
            time: "11:30 AM - 12:30 PM",
            status: "upcoming",
            teacher: "Ms. Emily Davis",
            avatar: "https://randomuser.me/api/portraits/women/44.jpg",
            link: "https://meet.google.com/eng-class-link",
            targetTime: new Date(new Date().getTime() + 45 * 60 * 60 * 1000).toString() 
        }
    ];

    // Function to render class cards dynamically
    function renderClasses(data) {
        const grid = document.getElementById('classesGridContainer');
        grid.innerHTML = '';

        if(data.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #888;">
                                <i class="fa-regular fa-calendar-xmark" style="font-size: 40px; margin-bottom: 10px; color: #ccc;"></i>
                                <p>No online classes found for the selected criteria.</p>
                              </div>`;
            return;
        }

        data.forEach(item => {
            let statusBadgeHtml = '';
            let actionBtnHtml = '';
            let countdownHtml = '';

            if(item.status === 'live') {
                statusBadgeHtml = `<span class="status-badge status-live"><i class="fa-solid fa-circle"></i> Live Now</span>`;
                actionBtnHtml = `<button class="ui-join-btn" onclick="joinRoom('${item.link}')"><i class="fa-solid fa-video"></i> Join Classroom Now</button>`;
            } else {
                statusBadgeHtml = `<span class="status-badge status-upcoming"><i class="fa-regular fa-clock"></i> Upcoming</span>`;
                actionBtnHtml = `<button class="ui-join-btn" disabled><i class="fa-solid fa-lock"></i> Class Locked</button>`;
                if(item.targetTime) {
                    countdownHtml = `<div class="countdown-text" id="countdown-${item.id}">Calculating remaining time...</div>`;
                }
            }

            const card = document.createElement('div');
            card.className = `class-ui-card`;
            card.setAttribute('data-subject', item.subject.toLowerCase());
            card.setAttribute('data-teacher', item.teacher.toLowerCase());
            card.setAttribute('data-status', item.status);
            card.setAttribute('data-day', item.day.toLowerCase());

            card.innerHTML = `
                <div>
                    <div class="card-top-info">
                        <span class="subject-tag ${item.subjectClass}">${item.subject}</span>
                        ${statusBadgeHtml}
                    </div>
                    
                    <div class="class-detail-body">
                        <h4>${item.topic}</h4>
                        <div class="schedule-meta-list">
                            <div class="meta-row">
                                <i class="fa-regular fa-calendar-days"></i>
                                <strong>${item.day}, ${item.date}</strong>
                            </div>
                            <div class="meta-row">
                                <i class="fa-regular fa-clock"></i>
                                <span>${item.time}</span>
                            </div>
                        </div>
                    </div>

                    <div class="faculty-row">
                        <img src="${item.avatar}" alt="Faculty">
                        <div>
                            <h5>${item.teacher}</h5>
                            <p>Instructor</p>
                        </div>
                    </div>
                </div>

                <div class="card-action-area">
                    ${countdownHtml}
                    ${actionBtnHtml}
                </div>
            `;
            grid.appendChild(card);

            // Initialize live counter timers if target exists
            if(item.status === 'upcoming' && item.targetTime) {
                startCountdown(`countdown-${item.id}`, item.targetTime);
            }
        });
    }

    // Classroom redirect handler
    function joinRoom(url) {
        window.open(url, '_blank');
    }

    // Real-time Countdown Engine
    function startCountdown(elementId, targetDateString) {
        const target = new Date(targetDateString).getTime();
        
        function updateTimer() {
            const now = new Date().getTime();
            const diff = target - now;
            const element = document.getElementById(elementId);
            
            if (!element) return;

            if (diff <= 0) {
                element.innerHTML = "Class is about to start!";
                element.style.color = "#17b05c";
                return;
            }

            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            
            if(hours > 0) {
                element.innerHTML = `<i class="fa-solid fa-hourglass-start"></i> Starts in ${hours}h ${minutes}m`;
            } else {
                element.innerHTML = `<i class="fa-solid fa-hourglass-start"></i> Starts in ${minutes} mins`;
            }
        }
        
        updateTimer();
        setInterval(updateTimer, 60000); // refresh every minute
    }

    // Category Filter system
    function filterClasses(category, btnElement) {
        // Toggle Active state on buttons
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        if(category === 'all') {
            renderClasses(onlineClassesData);
        } else if (category === 'live') {
            const filtered = onlineClassesData.filter(c => c.status === 'live');
            renderClasses(filtered);
        } else if (category === 'today') {
            const filtered = onlineClassesData.filter(c => c.day.toLowerCase() === 'today');
            renderClasses(filtered);
        } else if (category === 'upcoming') {
            const filtered = onlineClassesData.filter(c => c.status === 'upcoming');
            renderClasses(filtered);
        }
    }

    // Search input optimization
    function searchClasses() {
        const query = document.getElementById('classSearchInput').value.toLowerCase();
        const filtered = onlineClassesData.filter(item => {
            return item.subject.toLowerCase().includes(query) || 
                   item.teacher.toLowerCase().includes(query) || 
                   item.topic.toLowerCase().includes(query);
        });
        renderClasses(filtered);
    }

    // On Load Initializer
    window.addEventListener('DOMContentLoaded', () => {
        renderClasses(onlineClassesData);
    });
</script>

</body>
</html>
